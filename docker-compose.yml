version: '3.8'

services:
  arediadownload-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arediadownload-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - MAX_CONCURRENT_DOWNLOADS=2
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
