services:
  arediadownload-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arediadownload-web
    restart: unless-stopped
    ports:
      # Change the host port (left) via PORT env variable in Portainer, defaults to 9421
      - "${PORT:-9421}:8000"
    volumes:
      # Mount host media directory
      - /mnt/Media/downloads:/downloads
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - MAX_CONCURRENT_DOWNLOADS=2
      - PYTHONUNBUFFERED=1
      - POT_PROVIDER_URL=http://pot-provider:4416
    depends_on:
      pot-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.1
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
