version: '3.8'

services:
  arediadownload:
    image: arediadownload:latest
    container_name: arediadownload-web
    restart: unless-stopped
    ports:
      # Change the host port (left side) via PORT env variable, defaults to 9421
      - "${PORT:-9421}:8000"
    volumes:
      # Host media storage directory
      - /mnt/Media/downloads:/downloads
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - MAX_CONCURRENT_DOWNLOADS=2
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
