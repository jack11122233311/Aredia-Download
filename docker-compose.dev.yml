services:
  arediadownload-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arediadownload-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      - PUID=1000
      - PGID=1000
      - MAX_CONCURRENT_DOWNLOADS=2
      - PYTHONUNBUFFERED=1
      - POT_PROVIDER_URL=http://pot-provider:4416
    depends_on:
      pot-provider:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.1
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
