version: '3.8'

services:
  arediadownload-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arediadownload-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      - PUID=1000
      - PGID=1000
      - MAX_CONCURRENT_DOWNLOADS=2
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
